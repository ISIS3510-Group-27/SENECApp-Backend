# Production stack for a single server (see docs/deploy-aws.md).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Differences from docker-compose.yml:
# - Caddy terminates HTTPS (automatic Let's Encrypt certificate for $DOMAIN).
# - Only Caddy publishes ports (80/443). PostgreSQL and the API are private.
# - No default passwords: POSTGRES_PASSWORD and DOMAIN must be set in .env.

services:
  db:
    image: postgres:16-alpine
    container_name: senecapp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-senecapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-senecapp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: senecapp-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-senecapp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-senecapp}
      # Trust X-Forwarded-* from Caddy so redirects and URLs use https://.
      # Safe because the API port is only reachable inside this Docker network.
      FORWARDED_ALLOW_IPS: "*"
    expose:
      - "8000"
    volumes:
      - ./secrets:/code/secrets:ro
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: senecapp-caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
