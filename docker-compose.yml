services:
  db:
    image: postgres:16-alpine
    container_name: senecapp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-senecapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-senecapp}
      POSTGRES_DB: ${POSTGRES_DB:-senecapp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: senecapp-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-senecapp}:${POSTGRES_PASSWORD:-senecapp}@db:5432/${POSTGRES_DB:-senecapp}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
